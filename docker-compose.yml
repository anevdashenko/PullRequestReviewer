services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prr
      POSTGRES_PASSWORD: prr
      POSTGRES_DB: prr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prr -d prr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://prr:prr@postgres:5432/prr?schema=public
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-in-prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      PR_POLL_INTERVAL_MS: ${PR_POLL_INTERVAL_MS:-0}
      COMMIT_POLL_INTERVAL_MS: ${COMMIT_POLL_INTERVAL_MS:-0}
      COMMIT_REVIEW_LOOKBACK_SEC: ${COMMIT_REVIEW_LOOKBACK_SEC:-86400}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && node dist/worker.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://prr:prr@postgres:5432/prr?schema=public
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_JSON_OBJECT_MODE: ${OPENAI_JSON_OBJECT_MODE:-}
      QWEN_SETTINGS_PATH: /config/qwen/settings.json
      QWEN_CLI_PATH: ${QWEN_CLI_PATH:-qwen}
      QWEN_CLI_TIMEOUT_MS: ${QWEN_CLI_TIMEOUT_MS:-600000}
      QWEN_CLI_EXTRA_ARGS: ${QWEN_CLI_EXTRA_ARGS:-}
      REPO_CACHE_ROOT: /var/cache/prr/repos
      REPO_CACHE_GIT_TIMEOUT_MS: ${REPO_CACHE_GIT_TIMEOUT_MS:-300000}
      REPO_CACHE_FETCH_DEPTH: ${REPO_CACHE_FETCH_DEPTH:-0}
      DIFF_MAX_CHARS: ${DIFF_MAX_CHARS:-}
      INCLUDE_FULL_FILE_CONTENT: ${INCLUDE_FULL_FILE_CONTENT:-}
      PATCH_MIN_CHARS: ${PATCH_MIN_CHARS:-}
      FILE_MAX_CHARS: ${FILE_MAX_CHARS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    volumes:
      - ${QWEN_SETTINGS_FILE:-./config/qwen/settings.json}:/config/qwen/settings.json:ro
      - prr-repo-cache:/var/cache/prr/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  prr-repo-cache:
